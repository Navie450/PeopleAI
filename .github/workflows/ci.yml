name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  auth-service:
    name: Auth Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/auth-service/package-lock.json

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  employee-service:
    name: Employee Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/employee-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/employee-service/package-lock.json

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [frontend, auth-service, employee-service]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag vars
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & Push Auth Service
        uses: docker/build-push-action@v6
        with:
          context: ./services/auth-service
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/peopleai-auth-service:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/peopleai-auth-service:${{ steps.vars.outputs.sha_short }}

      - name: Build & Push Employee Service
        uses: docker/build-push-action@v6
        with:
          context: ./services/employee-service
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/peopleai-employee-service:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/peopleai-employee-service:${{ steps.vars.outputs.sha_short }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/peopleai-frontend:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/peopleai-frontend:${{ steps.vars.outputs.sha_short }}
